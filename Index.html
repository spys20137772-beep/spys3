<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="총 250종을 모으고 파츠로 커스텀하는 쿼터뷰 오픈월드 슈팅 RPG. 친구랑 같이 사냥하고 기지를 털어라!">
<meta property="og:type" content="website">
<meta property="og:title" content="파츠헌터 — 오픈월드 슈팅 RPG">
<meta property="og:description" content="총을 모으고 커스텀해서 넓은 세상을 사냥하자. 폰·PC 둘 다 바로 플레이!">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<title>파츠헌터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* layout: full-screen canvas world, HTML HUD floating at the edges, bag as a bottom sheet */
:root{
  --ink:#0f1813; --panel:rgba(16,26,20,.94); --panel2:#1b2a21; --line:#2f4636;
  --text:#eef3e4; --mute:#9fb19f; --leaf:#9bd36a; --amber:#f2b84b; --danger:#ff6a5c;
  --r0:#b9c1b2; --r1:#6fd16f; --r2:#4fa8ff; --r3:#c47dff; --r4:#ffb02e; --r5:#ff4fe1; --r6:#70f5ff;
  --disp:"Do Hyeon","Jua",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--disp)}
#stat{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:178px;display:grid;gap:5px}
#stat .row{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.bar{height:9px;background:#0b120e;border-radius:5px;overflow:hidden;border:1px solid #233428}
.bar i{display:block;height:100%;width:50%;transition:width .15s}
#hpb i{background:linear-gradient(90deg,#e8534a,#ff8a5c)} #xpb i{background:var(--leaf)}
.money{display:flex;gap:10px;font-size:14px;color:var(--amber);font-variant-numeric:tabular-nums}
.money b{color:#8fd0ff;font-weight:400}
#qs{position:absolute;top:calc(134px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;z-index:2}
#qs button{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--panel);padding:2px;position:relative;cursor:pointer}
#qs button.on{border-color:var(--amber);box-shadow:0 0 0 2px rgba(242,184,75,.35)}
#qs button img{width:100%;height:100%}
#qs button b{position:absolute;top:1px;left:4px;font-family:var(--disp);font-weight:400;font-size:12px;color:var(--mute)}
#wrap.noui #qs{display:none!important}
.bag-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bag-tools select,.bag-tools input{font-family:var(--body);font-size:13px;background:#0f1813;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.bag-tools input{flex:1 1 120px}
.cell .nw{position:absolute;bottom:2px;left:4px;font-style:normal;font-family:var(--disp);font-size:10px;color:#2a1d05;background:var(--amber);border-radius:4px;padding:0 3px}
.cell .lk{position:absolute;bottom:2px;right:4px;font-style:normal;font-size:11px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.cmp div{display:flex;justify-content:space-between;color:var(--mute)}
.up{color:#7ee07e}.dn{color:#ff8a7a}
.log{display:grid;gap:4px;font-size:13px;max-height:52vh;overflow:auto}
.log div{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.log small{color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.set-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.set-row input[type=range]{width:100%;accent-color:var(--amber)}
#bigMap{width:100%;max-width:520px;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:#16231a;justify-self:center}
#quest{top:calc(82px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:178px;
  background:rgba(16,26,20,.78);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:6px 9px;font-size:14px}
#quest small{display:block;color:var(--mute);font-family:var(--body);font-size:12px;margin-top:2px}
#mini{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  width:110px;height:110px;border-radius:10px;border:1px solid var(--line);background:#16231a;pointer-events:none}
#btns{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:grid;gap:8px;transition:transform .32s cubic-bezier(.2,.9,.25,1.1),opacity .25s}
#btns.col{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.rb{pointer-events:auto;font-family:var(--disp);font-size:15px;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;width:104px;height:38px;cursor:pointer}
.rb:active{transform:scale(.96)} .rb:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.rb kbd{font-family:var(--body);font-size:11px;color:var(--mute);margin-left:4px}
#ammo{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px;white-space:nowrap}
#ammo .n{font-size:22px;font-variant-numeric:tabular-nums} #ammo .rl{color:var(--amber)}
#bDash{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;z-index:2;
  font-family:var(--disp);font-size:15px;color:var(--text);background:rgba(16,26,20,.7);border:2px solid #7fd6ff;cursor:pointer;touch-action:manipulation}
#bDash.cd{opacity:.45}
@media (hover:hover) and (pointer:fine){#bDash{display:none}}
#wrap.noui #bDash{display:none!important}
.sheet{animation:sheetIn .32s cubic-bezier(.2,.9,.25,1.12)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.2}to{transform:none;opacity:1}}
.toast{animation:tpop .34s cubic-bezier(.2,.9,.25,1.4)!important}
@keyframes tpop{0%{transform:translateY(-10px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
#zone.show{animation:zin .7s cubic-bezier(.2,.9,.25,1.1)}
@keyframes zin{from{letter-spacing:.5em;opacity:0;transform:translateX(-50%) scale(1.2)}to{letter-spacing:.06em;opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.sheet,.toast,#zone.show{animation:none!important}}

/* ===== 캐릭터 만들기 ===== */
.sheet:has(> .cc){width:min(100%,920px);padding:0;gap:0;background:linear-gradient(180deg,#1a221c,#10170f);border-color:#2f4434}
.cc{display:grid;gap:0}
.cc-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #26382c}
.cc-head h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:0}.cc-head>div{flex:1}
.cc-body{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0}
@media (max-width:720px){.cc-body{grid-template-columns:1fr}.cc-prev{padding:10px;gap:6px;border-right:0;border-bottom:1px solid #26382c}.cc-prev canvas{max-width:140px}.cc-nm{font-size:17px}.cc-row{grid-template-columns:56px minmax(0,1fr)}}
.cc-prev{display:grid;justify-items:center;gap:10px;padding:16px;border-right:1px solid #26382c;background:radial-gradient(ellipse at 50% 30%,rgba(242,184,75,.08),transparent 65%)}
.cc-prev canvas{width:100%;max-width:260px;aspect-ratio:360/400}
.cc-nm{font-family:var(--disp);font-size:20px;color:var(--amber);letter-spacing:.04em;min-height:24px}
.cc-opts{padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.cc-name{display:grid;gap:6px;font-family:var(--disp);font-size:14px;color:var(--mute)}
.cc-name input{font-family:var(--disp);font-size:20px;padding:10px 12px;border-radius:12px;border:1px solid #36503f;background:#0b130e;color:var(--text)}
.cc-name input:focus{outline:2px solid var(--amber);outline-offset:1px}
.cc-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.cc-row>span{font-family:var(--disp);font-size:14px;color:var(--mute)}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px}
.cc-chips button{font-family:var(--body);font-size:13px;padding:7px 11px;border-radius:20px;border:1px solid #2f4434;background:#0d1611;color:var(--text);cursor:pointer}
.cc-chips button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#2a1d05}
.cc-sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.cc-sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:var(--sw);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cc-sw button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--amber)}
.cc-pick{position:relative;width:30px;height:30px;border-radius:50%;border:2px dashed #5a7363;display:grid;place-items:center;color:var(--mute);font-size:16px;cursor:pointer;overflow:hidden}
.cc-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cc-go{margin:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:18px;padding:12px}

/* ===== 인벤토리 ===== */
.sheet:has(> .inv){width:min(100%,1000px);max-height:96%;padding:0;gap:0;background:linear-gradient(180deg,#16211b,#0f1612);border-color:#2c3f33}
.inv{display:grid;grid-template-rows:auto 1fr;min-height:0}
.inv-head{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #26382c;background:linear-gradient(90deg,rgba(242,184,75,.08),transparent 60%);position:sticky;top:0;z-index:2;backdrop-filter:blur(6px)}
.inv-head{flex-wrap:wrap}
.inv-head h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:0;letter-spacing:.04em;white-space:nowrap}
@media (max-width:520px){.inv-head h2{font-size:21px}.inv-cap{min-width:80px}.chip{font-size:12px;padding:4px 8px}.doll{grid-template-columns:48px 1fr 48px}.ds{width:48px;height:48px}.doll canvas{max-width:190px}}
.inv-cap{display:grid;gap:3px;min-width:110px}
.inv-cap .bar{height:5px;border:0;background:#0a110d}.inv-cap .bar i{background:linear-gradient(90deg,var(--leaf),var(--amber));width:0}
.inv-cap small{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:14px;padding:5px 10px;border-radius:20px;background:#0c140f;border:1px solid #2a3c30;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.gold{color:var(--amber)}.chip.parts{color:#8fd0ff}
.xbtn{width:36px;height:36px;border-radius:10px;border:1px solid #2c3f33;background:#121c16;color:var(--text);font-size:16px;cursor:pointer;flex:none}
.inv-body{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
@media (max-width:760px){.inv-body{grid-template-columns:1fr}.inv-left{border-right:0!important;border-bottom:1px solid #26382c}}
.inv-left{border-right:1px solid #26382c;padding:14px;display:grid;gap:12px;align-content:start;background:radial-gradient(ellipse at 50% 0%,rgba(79,227,255,.06),transparent 60%)}
.inv-right{padding:14px max(16px,env(safe-area-inset-right,0px)) 16px 14px;display:grid;gap:10px;align-content:start;min-width:0}
.doll{position:relative;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:4px}
.doll canvas{width:100%;max-width:240px;justify-self:center;aspect-ratio:170/180;display:block}
.dslots{display:grid;gap:8px}
.ds{width:52px;height:52px;border-radius:12px;border:1px dashed #3a5243;background:#0b130e;display:grid;place-items:center;padding:3px;cursor:pointer;position:relative;color:var(--mute);font-size:10px;font-family:var(--disp)}
.ds.on{border-style:solid;border-color:var(--rc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 28%,transparent),#0b130e 72%)}
.ds img{width:100%;height:100%}
.ds b{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-weight:400;font-size:10px;color:var(--mute);white-space:nowrap}
.eqw{border:1px solid #26382c;border-radius:14px;padding:10px;background:#0d1511;display:grid;gap:8px}
.eqw-h{display:flex;gap:10px;align-items:center}
.eqw-h img{width:56px;height:56px;border-radius:10px;background:#0a100c;border:1px solid var(--rc)}
.eqw-h .nm{font-family:var(--disp);font-size:18px;line-height:1.1}
.eqw-h small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.sbars{display:grid;gap:5px}
.sb{display:grid;grid-template-columns:62px 1fr 44px;gap:8px;align-items:center;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.sb .t{height:6px;border-radius:4px;background:#08100b;overflow:hidden}.sb .t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3fae6a,var(--leaf))}
.sb span:last-child{text-align:right;color:var(--text)}
.mslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ms{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px dashed #33493b;background:#0a110d;display:grid;place-items:center;padding:3px;cursor:pointer;font-size:9px;color:#5f7565;font-family:var(--disp);text-align:center;line-height:1.1}
.ms.on{border-style:solid;border-color:var(--rc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 25%,transparent),#0a110d 72%)}
.ms img{width:100%;height:100%}
.qsr{display:flex;gap:6px;align-items:center}.qsr span{font-family:var(--disp);font-size:12px;color:var(--mute);margin-right:4px}
.qsr .ms{width:44px}
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sumg div{background:#0b130e;border:1px solid #22332a;border-radius:10px;padding:7px 9px;display:grid;gap:1px}
.sumg small{font-size:10px;color:var(--mute)}.sumg b{font-family:var(--disp);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;background:#0b130e;border:1px solid #22332a;border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1 0 auto;font-family:var(--disp);font-size:14px;color:var(--mute);background:transparent;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#2c4234,#1d2c22);color:var(--text);box-shadow:inset 0 0 0 1px #3d5a47}
.seg button i{font-style:normal;font-size:10px;color:#2a1d05;background:var(--amber);border-radius:6px;padding:0 5px;margin-left:5px}
.inv .grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.inv .cell{border:1px solid color-mix(in srgb,var(--rc) 65%,transparent);border-radius:12px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 30%,transparent),#0c140f 70%);transition:transform .12s,box-shadow .12s}
.inv .cell::after{content:"";position:absolute;left:8px;right:8px;bottom:3px;height:2px;border-radius:2px;background:var(--rc);opacity:.8}
.inv .cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 1px var(--rc)}
.inv .cell.sel{box-shadow:0 0 0 2px #fff,0 0 18px color-mix(in srgb,var(--rc) 60%,transparent)}
.inv .cell em{top:3px;right:5px;font-size:10px;background:rgba(0,0,0,.55);border-radius:4px;padding:0 3px}
.inv .det{border:1px solid #26382c;border-radius:14px;background:#0d1511;padding:12px;border-top:1px solid #26382c}
.inv .det .wname{font-size:20px}
.inv .bag-tools input,.inv .bag-tools select{background:#0b130e;border-color:#26382c;border-radius:10px}
.inv .muted{font-size:12px}
@media (prefers-reduced-motion:reduce){.inv .cell{transition:none}}

#talk{position:absolute;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  pointer-events:auto;font-family:var(--disp);font-size:17px;background:var(--amber);color:#2a1d05;border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
#bAds{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;
  font-family:var(--disp);font-size:16px;color:var(--text);background:var(--panel);border:2px solid var(--amber);cursor:pointer;z-index:2;touch-action:manipulation}
#bAds.on{background:var(--amber);color:#2a1d05}
#bAds:focus-visible{outline:2px solid #fff;outline-offset:3px}
#wrap.noui #stat,#wrap.noui #quest,#wrap.noui #mini,#wrap.noui #btns,#wrap.noui #ammo,#wrap.noui #talk{display:none!important}
#bShow{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:3;font-family:var(--disp);font-size:13px;
  color:var(--text);background:rgba(16,26,20,.55);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.adm-grid .btn{width:100%}
.btn.tog[aria-pressed="true"]{background:#ff6a5c;color:#2a0a05;border-color:#ff6a5c}
.adm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adm-row select,.adm-row input{font-family:var(--body);font-size:14px;background:#0f1813;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;flex:1 1 120px}
.sec-t{font-family:var(--disp);font-size:16px;color:var(--amber);margin-top:4px}
#start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,52,34,.75),rgba(6,10,8,.94));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#start:focus-visible{outline:2px solid var(--amber);outline-offset:-6px}
/* hidden 속성이 CSS display:grid에 덮이지 않도록 강제 */
#start[hidden]{display:none!important;pointer-events:none!important}
.st-card{display:grid;gap:12px;justify-items:center;text-align:center;max-width:420px}
.st-kicker{font-family:var(--disp);color:var(--leaf);letter-spacing:.14em;font-size:14px}
.st-card h1{font-family:var(--disp);font-weight:400;font-size:clamp(48px,14vw,84px);margin:0;line-height:1;color:var(--text);text-shadow:0 4px 0 #000,0 0 30px rgba(242,184,75,.25)}
.st-card p{margin:0;color:var(--mute);line-height:1.6;font-size:15px}
.st-go{font-family:var(--disp);font-size:22px;color:#2a1d05;background:var(--amber);border-radius:12px;padding:12px 28px;margin-top:6px;animation:pulse 1.4s ease-in-out infinite}
.st-card small{color:var(--mute);font-size:12px;line-height:1.7}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.st-go{animation:none}}
#toasts{top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:5px;justify-items:center;width:min(90vw,360px)}

function accList(){let L=[];try{L=JSON.parse(localStorage.getItem('ph_accs')||'[]')}catch(e){}if(!L.some(a=>a.k==='main'))L.unshift({k:'main',t:0});return L}
function accPurge(){const L=accList(),now=Date.now();let ch=0;for(const e of L)if(e.del&&e.del<=now&&e.k!==ACC&&e.k!=='main'){try{for(const x of['partshunter_v2','ph_id','ph_tok','ph_admk'])localStorage.removeItem(AK(x,e.k))}catch(er){}e.gone=1;ch=1}if(ch){accSaveList(L.filter(e=>!e.gone));if(typeof sheet!=='undefined'&&sheet.querySelector&&sheet.querySelector('.accs'))renderSettings()}}
